name: build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ipk (OpenWrt 24.10)
            openwrt: "24.10.6"
            sdk: "openwrt-sdk-24.10.6-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
            ext: "ipk"
          - label: apk (OpenWrt 25.12)
            openwrt: "25.12.5"
            sdk: "openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
            ext: "apk"

    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          path: src

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-multilib g++-multilib \
            bison flex gawk gettext git libncurses-dev libssl-dev \
            python3 rsync unzip zlib1g-dev file wget zstd \
            pkg-config libelf-dev swig xsltproc time ccache
          sudo apt-get clean

      - name: Download OpenWrt SDK (${{ matrix.openwrt }})
        run: |
          url="https://downloads.openwrt.org/releases/${{ matrix.openwrt }}/targets/x86/64/${{ matrix.sdk }}"
          echo "fetching $url"
          wget -q "$url"
          mkdir -p sdk
          tar -I zstd -xf "${{ matrix.sdk }}" -C sdk --strip-components=1
          ls sdk | head

      - name: Stage package
        run: |
          mkdir -p sdk/package/luci-app-adguardhome
          rsync -a --exclude '.git' src/ sdk/package/luci-app-adguardhome/
          find sdk/package/luci-app-adguardhome -maxdepth 1 -type f

      - name: Build
        working-directory: sdk
        run: |
          [ -f feeds.conf ] || cp feeds.conf.default feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "CONFIG_PACKAGE_luci-app-adguardhome=m" >> .config
          echo "CONFIG_LUCI_LANG_zh_Hans=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-adguardhome-zh-cn=y" >> .config
          make defconfig
          make package/luci-app-adguardhome/compile V=s -j"$(nproc)"

      - name: Collect artifacts
        run: |
          mkdir -p out
          find sdk/bin/packages -type f \( -name '*luci-app-adguardhome*.${{ matrix.ext }}' -o -name '*luci-i18n-adguardhome*.${{ matrix.ext }}' \) -exec cp -v {} out/ \;
          ls -lh out/

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: luci-app-adguardhome-${{ matrix.ext }}
          path: out/*
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2
      - id: ver
        run: |
          echo "version=$(grep -m1 '^PKG_VERSION:=' Makefile | cut -d= -f2)" >> $GITHUB_OUTPUT
          echo "date=$(TZ=Asia/Shanghai date '+%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          body: |
            版本：v${{ steps.ver.outputs.version }}
            编译日期：${{ steps.ver.outputs.date }}
            Commit：${{ steps.ver.outputs.sha }}
          files: |
            artifacts/**/*.ipk
            artifacts/**/*.apk
          fail_on_unmatched_files: false
